[project]
name = "agentic-econ-lab"
version = "0.7.3"
description = "A multi-agent framework for economics research"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Herbert Dawid"},
    {name = "Philipp Harting"},
    {name = "Hankui Wang"},
    {name = "Zhongli Wang"},
    {name = "Jiachen Yi"},
]
requires-python = ">=3.10"
keywords = ["agents", "economics", "research", "multi-agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",          # calibration harness parameter estimation
    "sympy>=1.14",          # calibration harness equation parsing
    "statsmodels>=0.14",    # estimation harness (OLS/HAC, diagnostics)
    "linearmodels>=6.0",    # estimation harness (IV, panel)
    "pyyaml>=6.0",
    "mesa>=3.0,<4",         # agent-based simulation backend
    "openai>=1.0",
    "arxiv>=2.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "yfinance>=0.2",
    "fredapi>=0.5",
    "pypdf>=4.0",           # PDF extraction for crawled working papers
    "trafilatura>=1.8",     # default open crawler
    "crawl4ai>=0.4",        # browser crawler fallback (run `playwright install chromium` once)
    "ddgs>=9.0",            # open web search fallback
    "matplotlib>=3.8",      # report figures
]

[project.urls]
Repository = "https://github.com/AgenticEconLab/agentic-econ-lab"
Paper = "https://arxiv.org/abs/2504.09736"
Data = "https://doi.org/10.5281/zenodo.23193486"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
]
anthropic = [
    "anthropic>=0.30",
]
google = [
    "google-generativeai>=0.5",
]
all-providers = [
    "anthropic>=0.30",
    "google-generativeai>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "requires_api: marks tests that require live API keys",
]

[tool.coverage.run]
source = ["shared", "evaluation"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

# AEL runs from a checkout with the repository root on PYTHONPATH (see README.md); the team
# directories hold numbered stage scripts rather than importable packages. Installing this
# project (`pip install .`) installs the dependencies only.
[tool.setuptools]
packages = []
py-modules = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
